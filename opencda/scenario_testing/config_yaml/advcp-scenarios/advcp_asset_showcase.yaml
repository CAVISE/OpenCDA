description: |-
  Minimal AdvCP spoofing showcase for inspecting asset bundles. A standing
  attacker (cav-2) injects one fake car 8 m ahead of itself, the victim
  (cav-1, ego) drives slowly past it. Dense noise-free lidars make the
  injected surface of the car mesh easy to see in vis_bev / vis_3d.

world:
  fixed_delta_seconds: 0.1
  town: Town06

blueprint:
  use_multi_class_bp: true
  bp_meta_path: "opencda/assets/blueprint_meta/bbx_stats_0915.json"
  bp_class_sample_prob:
    car: 0.5
    truck: 0.1
    bus: 0.1
    bicycle: 0.1
    motorcycle: 0.1

# Dense, noise-free lidar: one full rotation per 0.1 s tick, 64 channels,
# about 200k points per scan and no random dropout, so every ray that hits
# the spoofed mesh produces a point.
vehicle_base:
  sensing:
    perception:
      activate: false
      camera:
        visualize: 0
        num: 1
        positions:
          - [2.5, 0, 1.0, 0]
      lidar:
        visualize: false
        channels: 64
        range: 100
        points_per_second: 2000000
        rotation_frequency: 10
        upper_fov: 2
        lower_fov: -25
        dropoff_general_rate: 0.0
        dropoff_intensity_limit: 1.0
        dropoff_zero_intensity: 0.0
        noise_stddev: 0.0

    localization:
      activate: false # when not activated, ego position will be retrieved from server directly
      debug_helper:
        show_animation: false # whether to show real-time trajectory plotting

  behavior:
    max_speed: 20 # slow drive-by so every frame shows the spoofed car clearly
    tailgate_speed: 20 # when a vehicles needs to be close to another vehicle asap
    speed_lim_dist: 3 # max_speed - speed_lim_dist = target speed
    speed_decrease: 15 # used in car following mode to decrease speed for distance keeping
    safety_time: 4 # ttc safety thresholding for decreasing speed
    emergency_param: 0.4 # used to identify whether a emergency stop needed
    ignore_traffic_light: false # whether to ignore traffic light
    overtake_allowed: false # whether overtake allowed, typically false for platoon leader
    collision_time_ahead: 2.0 # used for collision checking
    overtake_counter_recover: 35 # the vehicle can not do another overtake during next certain steps
    sample_resolution: 4.5 # the unit distance between two adjacent waypoints in meter
    local_planner:  # trajectory planning related
      buffer_size: 12 # waypoint buffer size
      trajectory_update_freq: 15 # used to control trajectory points updating frequency
      waypoint_update_freq: 9 # used to control waypoint updating frequency
      min_dist: 3 # used to pop out the waypoints too close to current location
      trajectory_dt: 0.20 # for every dt seconds, we sample a trajectory point from the trajectory path as next goal state
      debug: false # whether to draw future/history waypoints
      debug_trajectory: false # whether to draw the trajectory points and path


scenario:
  rsu_list:
  single_cav_list:
    - name: victim-cav-1 # ego: first CAV in the list
      spawn_position: [20, 149.792206, 0.3, 0, 0, 0]
      destination: [170, 149.792206, 0.3]
      id: 1

    - name: standing-attacker-cav-2
      spawn_position: [50, 135.792358, 0.3, 0, 0, 0]
      destination: [200, 135.792358, 0.3] # never reached: target speed is 0
      id: 2
      behavior:
        max_speed: 0 # max_speed - speed_lim_dist = 0 -> PID holds full brake
        speed_lim_dist: 0
        tailgate_speed: 0

coperception:
  visualization:
    background: [10, 14, 24]
    lidar_point_colors:
      other: [92, 219, 149] # victim (ego) lidar
      attackers: [224, 104, 104] # real points of the attacker
      spoofing: [56, 189, 248] # points injected from the car mesh
    bbox_colors:
      gt: [237, 255, 246]
      pred: [255, 196, 0]

  metrics:
    metric_configs:
      ap_at_iou: &cop_metric_defaults
        warmup_steps: 5
      mean_recall_at_iou: *cop_metric_defaults
      mean_precision_at_iou: *cop_metric_defaults
      attack_success_rate: *cop_metric_defaults
      attacker_benign_visibility_ratio: *cop_metric_defaults
      attacker_target_confidence: *cop_metric_defaults
