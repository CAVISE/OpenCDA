# For advcp_asset_showcase scenario: makes the selected --advcp-assets-id
# car mesh clearly visible in the lidar point clouds.
mode: spoofing

attacker_ids: [cav-2] # standing-attacker-cav-2

# The box only sets the pose: car_mesh_native_size keeps the mesh at its own
# dimensions, so differently sized bundles stay distinguishable. The box is
# deliberately larger than any bundled car because dense modes keep only the
# injected points that fall inside it.
car_mesh_native_size: true
default_size: [5.6, 2.6, 2.0]
boxes:
  - absolute: [58, 142.792206, 0.0, 0.0, 0.0, 0.0] # empty lane, 8 m ahead and 7 m beside the attacker

# dense_all ray-traces the whole mesh from the attacker's lidar and adds
# auxiliary rays from every neighbouring CAV pose, so the fake car is covered
# from several sides instead of only the attacker-facing one.
density: dense_all # replace, dense_a, dense_all, sampled
dense_distance: 10.0

# Intermediate-fusion parameters (ignored by early fusion).
max_perturb: 10.0
lr: 0.05
step: 25
sync: true
init: true
online: true
feature_size: 10
# Generate the car mesh on demand instead of loading it from the
# --advcp-assets-id bundle (cached under asset_cache_dir).
asset_runtime_generation: true
vehicle_blueprint: vehicle.audi.a2 # or car_mesh_dimensions: [4.3, 1.91, 1.26]
# car_mesh_source_path: /path/to/vehicle.obj # external mesh instead of a generic box
asset_cache_dir: ../../../../simulation_output/advcp_asset_cache
